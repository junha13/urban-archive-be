spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

#Datasource Configuration
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Datasource spring SQL init
spring.sql.init.mode=never

#Mybatis mapper location
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/**.xml

#Logging level => DEBUG
#logging.level.org.springframework.boot.autoconfigure=DEBUG
#logging.level.org.mybatis=DEBUG
#logging.level.archive.backend=DEBUG
#logging.level.archive.backend.domain.news.service.impl.NewsDAO=DEBUG
logging.level.archive.backend.domain.record.service.impl=DEBUG

#spring security admin login
spring.security.user.name=admin
spring.security.user.password=1234

#naver news API account
naver.client.id=${NAVER_CLIENT_ID}
naver.client.secret=${NAVER_CLIENT_SECRET}

springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/v3/api-docs